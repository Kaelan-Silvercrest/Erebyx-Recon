[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "erebyx"
dynamic = ["version"]
description = "Erebyx — modular OSINT & external recon toolkit for authorized security research"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Erebyx Contributors" }]
keywords = ["osint", "recon", "security", "dns", "rdap", "pandi"]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests>=2.31.0",
    "PyYAML>=6.0",
    "dnspython>=2.6.1",
]

[project.scripts]
erebyx = "erebyx.core.cli:main"

[tool.setuptools.dynamic]
version = { attr = "erebyx.__version__" }

[tool.setuptools.packages.find]
include = ["erebyx*"]

